<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Home Hunterz</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand">
      <img src="../icons/home-hunterz-icon-transparent.png" alt="Home Hunterz">
      <div class="admin-login-brand-word">HOME <span>HUNTERZ</span></div>
    </div>
    <p class="admin-login-sub">Admin login</p>

    <div class="admin-login-error" id="adminLoginError"></div>

    <form id="adminLoginForm" novalidate>
      <div class="admin-field">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" name="email" autocomplete="username" required>
      </div>
      <div class="admin-field">
        <label for="adminPassword">Password</label>
        <div class="admin-password-wrap">
          <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
          <button type="button" class="admin-password-toggle" id="adminPasswordToggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;padding:12px;margin-top:6px;">Log In</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script defer>
  // Wrapped in an arrow function rather than passed directly, because
  // `defer` has no effect on inline scripts (only on scripts with a src)
  // — this block runs immediately during parsing, before admin-auth.js
  // (an external deferred script) has actually executed. Wrapping means
  // initAdminLoginForm is only looked up later, once DOMContentLoaded
  // actually fires — by which point every deferred script has run.
  document.addEventListener("DOMContentLoaded", () => initAdminLoginForm());
</script>
</body>
</html>
