<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Contact Details — Home Hunterz Admin</title>
<link rel="stylesheet" href="css/admin.css">
<script>window.ADMIN_PAGE_TITLE = "Contact Details"; window.ADMIN_ACTIVE_NAV = "contact";</script>
</head>
<body>
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card" style="padding:22px;max-width:640px;">
    <p style="font-size:12.5px;color:var(--slate);margin-bottom:18px;">These details are used across the whole public site — header icons, footer, WhatsApp links, and every form's confirmation message — so updating them here updates everywhere at once.</p>
    <form id="settingsForm" novalidate>
      <div class="admin-form-row">
        <div class="admin-field"><label>Phone</label><input type="tel" id="s-phone" placeholder="+91 98840 38618"></div>
        <div class="admin-field"><label>WhatsApp</label><input type="tel" id="s-whatsapp" placeholder="+91 98840 38618"></div>
      </div>
      <div class="admin-field"><label>Email</label><input type="email" id="s-email"></div>
      <div class="admin-field"><label>Office Address</label><textarea id="s-office_address"></textarea></div>
      <div class="admin-field"><label>Google Maps URL</label><input type="url" id="s-google_maps_url"></div>
      <div class="pe-section-title" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);margin:20px 0 12px;">Social Media</div>
      <div class="admin-form-row">
        <div class="admin-field"><label>Instagram URL</label><input type="url" id="s-instagram_url"></div>
        <div class="admin-field"><label>Facebook URL</label><input type="url" id="s-facebook_url"></div>
      </div>
      <div class="admin-field"><label>YouTube URL</label><input type="url" id="s-youtube_url"></div>
      <button type="submit" class="admin-btn admin-btn-primary" style="margin-top:6px;">Save Changes</button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>
<script defer>
  document.addEventListener("DOMContentLoaded", () =>
    initSettingsForm(["phone", "whatsapp", "email", "office_address", "google_maps_url", "instagram_url", "facebook_url", "youtube_url"])
  );
</script>
</body>
</html>
