<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Settings — Home Hunterz Admin</title>
<link rel="stylesheet" href="css/admin.css">
<script>window.ADMIN_PAGE_TITLE = "Settings"; window.ADMIN_ACTIVE_NAV = "settings";</script>
</head>
<body>
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card" style="padding:22px;max-width:640px;">
    <form id="settingsForm" novalidate>
      <div class="admin-field"><label>Company Name</label><input type="text" id="s-company_name"></div>
      <div class="admin-field"><label>Logo URL</label><input type="url" id="s-logo_url">
        <p class="admin-field-hint">Upload your logo file to the Media Library first, then paste its URL here.</p>
      </div>
      <div class="pe-section-title" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);margin:20px 0 12px;">Default SEO</div>
      <div class="admin-field"><label>Default SEO Title</label><input type="text" id="s-default_seo_title"></div>
      <div class="admin-field"><label>Default Meta Description</label><textarea id="s-default_seo_description"></textarea></div>
      <button type="submit" class="admin-btn admin-btn-primary" style="margin-top:6px;">Save Changes</button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>
<script defer>
  document.addEventListener("DOMContentLoaded", () =>
    initSettingsForm(["company_name", "logo_url", "default_seo_title", "default_seo_description"])
  );
</script>
</body>
</html>
