<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SEO — Home Hunterz Admin</title>
<link rel="stylesheet" href="css/admin.css">
<script>window.ADMIN_PAGE_TITLE = "SEO"; window.ADMIN_ACTIVE_NAV = "seo";</script>
</head>
<body>
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card" style="padding:22px;max-width:640px;margin-bottom:18px;">
    <h2 style="font-size:15px;margin-bottom:6px;">Site-wide Defaults</h2>
    <p style="font-size:12.5px;color:var(--slate);margin-bottom:18px;">Used for pages that don't have their own SEO fields set — every individual property has its own SEO title/description/keywords/slug on its Edit Property page (SEO tab), which always takes priority over these defaults.</p>
    <form id="settingsForm" novalidate>
      <div class="admin-field"><label>Default SEO Title</label><input type="text" id="s-default_seo_title"></div>
      <div class="admin-field"><label>Default Meta Description</label><textarea id="s-default_seo_description"></textarea></div>
      <button type="submit" class="admin-btn admin-btn-primary" style="margin-top:6px;">Save Changes</button>
    </form>
  </div>

  <div class="admin-card" style="padding:22px;max-width:640px;">
    <h2 style="font-size:15px;margin-bottom:10px;">Per-Property SEO</h2>
    <p style="font-size:13px;color:var(--slate);">Page title, meta description, keywords, URL slug, canonical URL, and Open Graph image are all set per property — open any property in <a href="properties.html" style="color:var(--orange-600);font-weight:600;">Properties</a> and use the SEO tab.</p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>
<script defer>
  document.addEventListener("DOMContentLoaded", () =>
    initSettingsForm(["default_seo_title", "default_seo_description"])
  );
</script>
</body>
</html>
