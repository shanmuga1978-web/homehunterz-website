<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Homepage — Home Hunterz Admin</title>
<link rel="stylesheet" href="css/admin.css">
<script>window.ADMIN_PAGE_TITLE = "Homepage"; window.ADMIN_ACTIVE_NAV = "homepage";</script>
</head>
<body>
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card" style="padding:22px;max-width:640px;margin-bottom:18px;">
    <h2 style="font-size:15px;margin-bottom:6px;">Hero Section</h2>
    <p style="font-size:12.5px;color:var(--slate);margin-bottom:18px;">Editing these requires wiring the homepage hero to read from here instead of its current fixed text — see the note at the bottom of this page before relying on it.</p>
    <form id="settingsForm" novalidate>
      <div class="admin-field"><label>Hero Heading</label><input type="text" id="s-hero_heading"></div>
      <div class="admin-field"><label>Hero Subheading</label><textarea id="s-hero_subheading"></textarea></div>
      <div class="admin-field"><label>CTA Button Text</label><input type="text" id="s-hero_cta_text"></div>
      <button type="submit" class="admin-btn admin-btn-primary" style="margin-top:6px;">Save Changes</button>
    </form>
  </div>

  <div class="admin-card" style="padding:18px 22px;max-width:640px;background:#FFF3DC;border-color:#F5D28A;">
    <strong style="font-size:13px;">Not connected to the live homepage yet.</strong>
    <p style="font-size:12.5px;color:var(--slate);margin-top:4px;">
      Featured properties and testimonials on the homepage already come from what you Publish/Feature in
      <a href="properties.html" style="color:var(--orange-600);font-weight:600;">Properties</a> and
      <a href="testimonials.html" style="color:var(--orange-600);font-weight:600;">Testimonials</a> — those work today.
      The hero heading/subheading/CTA fields above save correctly, but the public hero section still shows its original fixed text rather than reading from here — connecting that is a small follow-up change to the hero markup.
    </p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>
<script defer>
  document.addEventListener("DOMContentLoaded", () =>
    initSettingsForm(["hero_heading", "hero_subheading", "hero_cta_text"])
  );
</script>
</body>
</html>
