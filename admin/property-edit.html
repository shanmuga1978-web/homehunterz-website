<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Add / Edit Property — Home Hunterz Admin</title>
<link rel="stylesheet" href="css/admin.css">
<style>
  .pe-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;}
  .pe-tab{padding:11px 16px;font-size:13px;font-weight:700;color:var(--slate);border-bottom:2px solid transparent;white-space:nowrap;}
  .pe-tab.active{color:var(--orange-600);border-bottom-color:var(--orange-600);}
  .pe-panel{display:none;}
  .pe-panel.active{display:block;}
  .pe-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);margin:22px 0 12px;}
  .pe-section-title:first-child{margin-top:0;}
  .pe-actions-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;margin:24px -20px -20px;border-radius:0 0 var(--radius-md) var(--radius-md);}
</style>
<script>window.ADMIN_PAGE_TITLE = "Add / Edit Property"; window.ADMIN_ACTIVE_NAV = "properties-add";</script>
</head>
<body>

<div id="adminShellSlot"></div>

<template id="propertyEditTemplate">
  <div class="admin-card" style="padding:20px;">
    <div class="pe-tabs">
      <button type="button" class="pe-tab active" data-tab="basic">Basic Details</button>
      <button type="button" class="pe-tab" data-tab="price">Price</button>
      <button type="button" class="pe-tab" data-tab="specs">Specifications</button>
      <button type="button" class="pe-tab" data-tab="description">Description &amp; Features</button>
      <button type="button" class="pe-tab" data-tab="images">Images</button>
      <button type="button" class="pe-tab" data-tab="video">Video</button>
      <button type="button" class="pe-tab" data-tab="seo">SEO</button>
    </div>

    <form id="propertyForm" novalidate>

      <!-- BASIC -->
      <div class="pe-panel active" data-panel="basic">
        <div class="admin-form-row">
          <div class="admin-field"><label>Property Title <span class="req">*</span></label><input type="text" id="f-title" required></div>
          <div class="admin-field"><label>Property Reference / ID</label><input type="text" id="f-reference_id" placeholder="Optional internal code"></div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Category <span class="req">*</span></label>
            <select id="f-category" required>
              <option value="">Select category</option>
              <option>Apartment</option><option>Flat</option><option>Independent House</option><option>Villa</option>
              <option>Residential Plot</option><option>Land</option><option>Commercial</option><option>Office</option>
              <option>Retail</option><option>Warehouse</option><option>Industrial</option><option>Other</option>
            </select>
          </div>
          <div class="admin-field"><label>Listing Type <span class="req">*</span></label>
            <select id="f-listing_type" required><option value="">Select</option><option>For Sale</option><option>For Rent</option><option>For Lease</option></select>
          </div>
          <div class="admin-field"><label>Status</label>
            <select id="f-status"><option>Available</option><option>Under Offer</option><option>Sold</option><option>Rented</option><option>Inactive</option></select>
          </div>
        </div>
        <div class="pe-section-title">Location</div>
        <div class="admin-form-row">
          <div class="admin-field"><label>Location (shown on cards) <span class="req">*</span></label><input type="text" id="f-location" required></div>
          <div class="admin-field"><label>Locality</label><input type="text" id="f-locality"></div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>City</label><input type="text" id="f-city" value="Chennai"></div>
          <div class="admin-field"><label>State</label><input type="text" id="f-state" value="Tamil Nadu"></div>
          <div class="admin-field"><label>Pincode</label><input type="text" id="f-pincode"></div>
        </div>
        <div class="admin-field"><label>Full Address</label><textarea id="f-full_address"></textarea></div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Google Maps URL</label><input type="url" id="f-google_maps_url"></div>
          <div class="admin-field"><label>Latitude</label><input type="text" id="f-latitude"></div>
          <div class="admin-field"><label>Longitude</label><input type="text" id="f-longitude"></div>
        </div>
      </div>

      <!-- PRICE -->
      <div class="pe-panel" data-panel="price">
        <div class="admin-form-row">
          <div class="admin-field"><label>Price (numeric, used for sorting)</label><input type="number" id="f-price" placeholder="e.g. 8500000"></div>
          <div class="admin-field"><label>Display Price</label><input type="text" id="f-display_price" placeholder="e.g. ₹85 Lakhs or ₹45,000 / Month"></div>
        </div>
        <div class="admin-form-row">
          <div class="admin-field"><label>Price per Sq.ft</label><input type="number" id="f-price_per_sqft"></div>
          <div class="admin-field" style="display:flex;gap:20px;align-items:center;padding-top:26px;">
            <label class="admin-checkbox"><input type="checkbox" id="f-is_negotiable"> Negotiable</label>
            <label class="admin-checkbox"><input type="checkbox" id="f-is_price_on_request"> Price on Request</label>
          </div>
        </div>
      </div>

      <!-- SPECS -->
      <div class="pe-panel" data-panel="specs">
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Land Area</label><input type="text" id="f-land_area"></div>
          <div class="admin-field"><label>Built-up Area</label><input type="text" id="f-builtup_area"></div>
          <div class="admin-field"><label>Carpet Area</label><input type="text" id="f-carpet_area"></div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>UDS</label><input type="text" id="f-uds"></div>
          <div class="admin-field"><label>Plot Area</label><input type="text" id="f-plot_area"></div>
          <div class="admin-field"><label>Area Unit</label>
            <select id="f-area_unit"><option>Sq.ft</option><option>Sq.m</option><option>Ground</option><option>Cent</option><option>Acre</option></select>
          </div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Bedrooms</label><input type="number" id="f-bedrooms"></div>
          <div class="admin-field"><label>Bathrooms</label><input type="number" id="f-bathrooms"></div>
          <div class="admin-field"><label>Balconies</label><input type="number" id="f-balconies"></div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Car Parking</label><input type="text" id="f-car_parking" placeholder="e.g. 2 Covered"></div>
          <div class="admin-field"><label>Property Age</label><input type="text" id="f-property_age"></div>
          <div class="admin-field"><label>Facing</label><input type="text" id="f-facing"></div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Floor Number</label><input type="text" id="f-floor_number"></div>
          <div class="admin-field"><label>Total Floors</label><input type="text" id="f-total_floors"></div>
          <div class="admin-field"><label>Furnishing</label>
            <select id="f-furnishing"><option value="">Select</option><option>Unfurnished</option><option>Semi-Furnished</option><option>Fully Furnished</option></select>
          </div>
        </div>
        <div class="admin-form-row-3">
          <div class="admin-field"><label>Possession Status</label><input type="text" id="f-possession_status"></div>
          <div class="admin-field"><label>Road Width</label><input type="text" id="f-road_width"></div>
          <div class="admin-field"><label>Frontage</label><input type="text" id="f-frontage"></div>
        </div>
        <div class="admin-form-row">
          <div class="admin-field"><label>Depth</label><input type="text" id="f-depth"></div>
          <div class="admin-field"><label>Approval / Authority</label><input type="text" id="f-approval_authority" placeholder="e.g. DTCP, CMDA"></div>
        </div>
        <div class="admin-field"><label>RERA Information</label><input type="text" id="f-rera_info"></div>
      </div>

      <!-- DESCRIPTION -->
      <div class="pe-panel" data-panel="description">
        <div class="admin-field"><label>Short Description</label><textarea id="f-short_description" placeholder="One or two lines shown on property cards"></textarea></div>
        <div class="admin-field"><label>Full Description</label><textarea id="f-full_description" style="min-height:160px;" placeholder="Paragraphs, headings (##), bullet points (- item) are all fine here."></textarea></div>
        <div class="admin-field"><label>Highlights (one per line)</label><textarea id="f-highlights" placeholder="Corner plot&#10;Gated community&#10;Ready to move in"></textarea></div>
        <div class="admin-field"><label>Nearby Landmarks</label><textarea id="f-nearby_landmarks"></textarea></div>
        <div class="pe-section-title">Amenities</div>
        <div class="admin-checkbox-grid" id="amenitiesGrid"></div>
      </div>

      <!-- IMAGES -->
      <div class="pe-panel" data-panel="images">
        <label class="admin-dropzone" id="imageDropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div style="font-weight:700;font-size:13.5px;">Drag &amp; drop images here, or click to choose</div>
          <div style="font-size:12px;color:var(--slate);margin-top:4px;">Any number of images. JPG, PNG or WebP, up to 8MB each.</div>
          <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp" multiple>
        </label>
        <div class="admin-upload-progress" id="uploadProgressWrap" style="display:none;">
          <div style="font-size:12.5px;color:var(--slate);" id="uploadProgressLabel"></div>
          <div class="admin-upload-progress-bar"><div class="admin-upload-progress-fill" id="uploadProgressFill"></div></div>
        </div>
        <p class="admin-field-hint" style="margin-top:10px;">Click the star on an image to make it the Featured Image. Drag images to reorder them. Save the property first if you haven't yet — images attach to a saved property.</p>
        <div class="admin-image-grid" id="imageGrid"></div>
      </div>

      <!-- VIDEO -->
      <div class="pe-panel" data-panel="video">
        <div class="admin-field"><label>YouTube URL</label><input type="url" id="f-video_youtube_url"></div>
        <div class="admin-field"><label>Instagram Reel URL</label><input type="url" id="f-video_instagram_url"></div>
        <div class="admin-field"><label>Property Video URL (other)</label><input type="url" id="f-video_other_url"></div>
        <p class="admin-field-hint">Leave all blank if there's no video — the public property page won't show an empty video section.</p>
      </div>

      <!-- SEO -->
      <div class="pe-panel" data-panel="seo">
        <div class="admin-field"><label>URL Slug</label><input type="text" id="f-slug" placeholder="auto-generated from title if left blank"></div>
        <div class="admin-field"><label>SEO Page Title</label><input type="text" id="f-seo_title"></div>
        <div class="admin-field"><label>Meta Description</label><textarea id="f-seo_description"></textarea></div>
        <div class="admin-field"><label>SEO Keywords</label><input type="text" id="f-seo_keywords" placeholder="comma, separated, keywords"></div>
        <div class="admin-field"><label>Canonical URL</label><input type="url" id="f-canonical_url"></div>
        <div class="admin-field"><label>Open Graph Image URL</label><input type="url" id="f-og_image_url" placeholder="Defaults to the featured image if left blank"></div>
      </div>

      <div class="pe-actions-bar">
        <span id="propertyFormStatus" style="margin-right:auto;align-self:center;font-size:12.5px;color:var(--slate);"></span>
        <a href="properties.html" class="admin-btn admin-btn-outline">Cancel</a>
        <button type="button" class="admin-btn admin-btn-outline" id="saveDraftBtn">Save Draft</button>
        <button type="button" class="admin-btn admin-btn-outline" id="previewBtn">Preview</button>
        <button type="button" class="admin-btn admin-btn-primary" id="publishBtn">Publish</button>
      </div>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-property-edit.js" defer></script>
</body>
</html>
